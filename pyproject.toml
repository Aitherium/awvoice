[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "awvoice"
version = "0.3.0"
description = "Turn speech into text and text into speech, on a service you host."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# The ear is OPTIONAL: a headless box that will never listen should not carry
# PortAudio. `awvoice listen` says exactly this when the import fails.
mic = ["sounddevice>=0.4"]
# The Aither voice on THIS machine (`--voice local:aither`): onnxruntime + espeak-ng.
# espeakng-loader is a py3-none wheel bundling libespeak-ng; no service, no account.
local = ["onnxruntime>=1.17", "espeakng-loader>=0.2", "numpy>=1.24"]

[project.scripts]
awvoice = "awvoice.cli:main"

[project.urls]
Homepage = "https://github.com/Aitherium/awvoice"
Documentation = "https://github.com/Aitherium/awvoice#readme"
Repository = "https://github.com/Aitherium/awvoice.git"
Issues = "https://github.com/Aitherium/awvoice/issues"

[tool.setuptools]
packages = ["awvoice"]
